# Los dos ambientes, con los valores de `P8/terraform/variables.tf`.
# Producción tiene el doble de CPU y más pods; todo lo demás es idéntico.
---
apiVersion: v1
kind: Namespace
metadata:
  name: sa-p8-stage
  labels:
    app.kubernetes.io/part-of: sa-platform
    app.kubernetes.io/managed-by: argocd
    sa.usac.edu.gt/practica: p9
    sa.usac.edu.gt/carne: "202202410"
    sa.usac.edu.gt/ambiente: stage
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sa-p8-quota
  namespace: sa-p8-stage
  labels:
    app.kubernetes.io/part-of: sa-platform
    app.kubernetes.io/managed-by: argocd
    sa.usac.edu.gt/practica: p9
    sa.usac.edu.gt/carne: "202202410"
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "12"
    limits.memory: 10Gi
    pods: "30"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sa-p8-limits
  namespace: sa-p8-stage
  labels:
    app.kubernetes.io/part-of: sa-platform
    app.kubernetes.io/managed-by: argocd
    sa.usac.edu.gt/practica: p9
    sa.usac.edu.gt/carne: "202202410"
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 96Mi }
      default: { cpu: 500m, memory: 512Mi }
      max: { cpu: "2", memory: 2Gi }
      min: { cpu: 10m, memory: 32Mi }
---
apiVersion: v1
kind: Namespace
metadata:
  name: sa-p8-prod
  labels:
    app.kubernetes.io/part-of: sa-platform
    app.kubernetes.io/managed-by: argocd
    sa.usac.edu.gt/practica: p9
    sa.usac.edu.gt/carne: "202202410"
    sa.usac.edu.gt/ambiente: prod
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sa-p8-quota
  namespace: sa-p8-prod
  labels:
    app.kubernetes.io/part-of: sa-platform
    app.kubernetes.io/managed-by: argocd
    sa.usac.edu.gt/practica: p9
    sa.usac.edu.gt/carne: "202202410"
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "16"
    limits.memory: 14Gi
    pods: "40"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sa-p8-limits
  namespace: sa-p8-prod
  labels:
    app.kubernetes.io/part-of: sa-platform
    app.kubernetes.io/managed-by: argocd
    sa.usac.edu.gt/practica: p9
    sa.usac.edu.gt/carne: "202202410"
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 96Mi }
      default: { cpu: 500m, memory: 512Mi }
      max: { cpu: "2", memory: 2Gi }
      min: { cpu: 10m, memory: 32Mi }
