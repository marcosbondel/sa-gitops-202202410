# ===========================================================================
# Sealed Secrets — el controlador que abre los SealedSecret del repositorio.
#
# Ola -40, con los demás complementos. En la P8 lo instalaba Terraform; en la
# P9 lo instala ArgoCD, porque «Terraform instala ArgoCD y el app-of-apps
# levanta el resto» (§3.2).
#
# ## Lo único que NO viene de aquí: la llave
#
# La llave privada la deja Terraform (`P9/terraform/20-gitops/llave.tf`) en
# `kube-system`, leída de Secret Manager, ANTES de que exista esta
# Application. El controlador arranca, encuentra una llave con la etiqueta
# `sealedsecrets.bitnami.com/sealed-secrets-key=active` y la usa en lugar de
# generar una. Así los SealedSecret de este repositorio se abren en cualquier
# clúster reconstruido.
#
# ## keyrenewperiod: "0"
#
# Por defecto el controlador genera una llave nueva cada 30 días DENTRO del
# clúster. Esa llave nunca llegaría a Secret Manager, y lo que se sellara con
# ella volvería a morir con el clúster: exactamente el problema de la P8. La
# rotación se hace fuera, a propósito, desde Terraform.
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-p9-sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p9-base
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # El nombre que `kubeseal` busca por defecto.
        fullnameOverride: sealed-secrets-controller
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
