# ===========================================================================
# Secretos sellados de stage.
#
# Lo que hay en `sealed-secrets/stage/` es CRIPTOGRAMA, no credenciales:
# está cifrado con la clave pública de este clúster y solo su clave privada
# —que nunca sale de él— puede descifrarlo. Por eso el repositorio puede ser
# público.
#
# ## Por qué la onda -10
#
# El controlador de Sealed Secrets convierte cada `SealedSecret` en un
# `Secret` corriente, y eso tarda unos segundos. La plataforma (onda 0) monta
# esos Secrets: si arrancara antes, sus pods quedarían en
# `CreateContainerConfigError` esperando un Secret que todavía no existe.
#
# Se recuperarían solos —Kubernetes reintenta— pero el primer despliegue
# mostraría medio namespace en rojo durante un minuto, y eso es indistinguible
# de un fallo real para quien lo esté mirando.
#
# ## Un `SealedSecret` no se puede mover de namespace
#
# El controlador se niega a descifrar uno que aparezca en un namespace distinto
# de aquel para el que se selló. Es a propósito: copiar el archivo de `stage`
# a otro ambiente no funciona, y por eso `scripts/02-sellar-secretos.sh` sella
# dos veces en lugar de una.
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-p8-secretos-stage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p8

  source:
    repoURL: https://github.com/marcosbondel/sa-gitops-202202410.git
    targetRevision: main
    path: sealed-secrets/stage

  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8-stage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Los namespaces los crea Terraform. Ver `P8/terraform/namespaces.tf`.
      - CreateNamespace=false

  ignoreDifferences:
    # El `Secret` que el controlador genera a partir del `SealedSecret` NO
    # está en el repositorio, pero ArgoCD lo ve porque lleva la referencia de
    # propiedad del SealedSecret. Sin esto, cada sincronización lo marcaría
    # como recurso extra y `prune: true` intentaría borrarlo: el controlador
    # lo volvería a crear, ArgoCD a borrarlo, y así indefinidamente.
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
