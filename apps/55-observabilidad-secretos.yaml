# ===========================================================================
# Secretos del stack de observabilidad (Práctica 10): hoy, solo las
# credenciales del administrador de Grafana, selladas.
#
# Ola 1, antes que kube-prometheus-stack (ola 2): Grafana no arranca sin el
# Secret, y la raíz no pasaría nunca de la ola 2 si el Secret llegara después.
# Esta Application crea además el namespace `observabilidad`.
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-p10-observabilidad-secretos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p10-observabilidad
  source:
    repoURL: https://github.com/marcosbondel/sa-gitops-202202410.git
    targetRevision: main
    path: observabilidad/secretos
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
