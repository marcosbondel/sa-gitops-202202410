# ===========================================================================
# El Schedule de Velero — ola 10, la ÚLTIMA.
#
# Al final a propósito. Si el Schedule llegara con los complementos (-40), un
# tic del cron que cayera durante la reconstrucción —antes de la ola -15—
# respaldaría los namespaces VACÍOS, y ese respaldo pasaría a ser «el más
# reciente»: la siguiente recuperación restauraría la nada. En la ola 10 la
# plataforma ya está sana y con sus datos restaurados.
#
# Velero 1.18 no respalda en el instante de crear el Schedule (observado en
# la primera reconstrucción real): el primer respaldo llega con el siguiente
# tic del cron, ≤ 15 min.
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-p9-respaldos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sa-p9-base
  source:
    repoURL: https://github.com/marcosbondel/sa-gitops-202202410.git
    targetRevision: main
    path: respaldos/programacion
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
