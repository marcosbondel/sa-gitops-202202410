# ===========================================================================
# Credenciales del administrador de Grafana (Práctica 10).
#
# Sellada con la llave pública de `sealed-secrets/clave-publica.pem` —la misma
# de la P9, que vive en Secret Manager y sobrevive al desastre—, en modo
# `strict`: solo se puede abrir como `grafana-admin` en `observabilidad`.
#
# La contraseña no está escrita en ningún lado fuera del clúster. Para leerla:
#
#   kubectl -n observabilidad get secret grafana-admin \
#     -o jsonpath='{.data.admin-password}' | base64 -d
#
# Va en una Application propia, en la ola 1, ANTES que kube-prometheus-stack
# (ola 2): Grafana no arranca sin este Secret, y si estuviera en la misma ola
# que los tableros (ola 4) la raíz esperaría para siempre a que el stack
# estuviera sano.
# ===========================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: observabilidad
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: observabilidad
