# ===========================================================================
# Qué raspa Prometheus de la plataforma (Práctica 10).
#
# Los tres servicios instrumentados exponen sus métricas en el puerto
# `metrics` (9464) de cada pod. Un PodMonitor —y no un ServiceMonitor— porque
# lo que interesa es CADA POD y no el Service: durante un canary, el Service
# estable y el canary apuntan a pods distintos, y el análisis tiene que poder
# separar las métricas de la versión candidata de las de la estable.
#
# ## Las dos etiquetas que se añaden a cada serie
#
#   service                      el nombre del servicio, de la etiqueta
#                                estándar `app.kubernetes.io/name` del pod.
#   rollouts_pod_template_hash   el hash del ReplicaSet que Argo Rollouts
#                                pone en cada pod. Es lo que permite al
#                                AnalysisTemplate preguntar por la versión
#                                CANDIDATA y solo por ella:
#                                  {rollouts_pod_template_hash="{{args.hash-canary}}"}
#                                Los pods de un Deployment (order-service,
#                                catalog-service) no la tienen y la serie
#                                sale sin ella.
#
# `namespace` y `pod` los pone Prometheus solo. `job` queda como
# `observabilidad/plataforma`.
# ===========================================================================
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: plataforma
  namespace: observabilidad
  labels:
    sa.usac.edu.gt/practica: p10
spec:
  namespaceSelector:
    matchNames:
      - sa-p8-prod
      - sa-p8-stage
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api-gateway, order-service, catalog-service]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
          targetLabel: rollouts_pod_template_hash
      metricRelabelings:
        # El exportador de OpenTelemetry añade a cada serie el nombre y la
        # versión del «scope» (el medidor). Son constantes por servicio y
        # solo engordan cada serie; `service` ya dice lo mismo.
        - action: labeldrop
          regex: otel_scope_(name|version|schema_url)
