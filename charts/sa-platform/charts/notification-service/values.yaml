# ===========================================================================
# notification-service — Notificaciones (Python 3.12 / FastAPI)
#
# El único componente que se despliega DOS veces desde la misma imagen:
#
#   · notification-service  →  `uvicorn app.main:app`   · API de solo lectura
#   · notification-worker   →  `python -m app.worker`   · consumidor del broker
#
# Son dos Deployments y no dos contenedores del mismo pod porque tienen razones
# distintas para escalar —la bandeja se consulta mucho más de lo que se
# producen eventos— y, sobre todo, porque apagar uno sin tocar al otro es lo
# que permite demostrar que los mensajes se acumulan en la cola sin perderse:
#
#     kubectl scale deploy/sa-platform-notification-worker --replicas=0 -n sa-p5
#
# La API sigue respondiendo mientras la cola crece.
#
# El worker se define en `templates/worker.yaml`; sus valores están abajo, en
# la clave `worker`.
# ===========================================================================

replicaCount: 2
component: backend

image:
  repository: sa-p5/notification-service
  tag: ""
  pullPolicy: ""

containerPort: 8000
service:
  enabled: true
  port: 8000

usesDatabase: true
postgresDatabase: notification_db
postgresUser: notification_user

# La API no se conecta al broker —es de solo lectura— pero sí recibe sus
# variables: el endpoint raíz reporta qué colas consume el worker, y ambos
# procesos comparten `config.py`. Recibir la configuración no da acceso: las
# NetworkPolicies no autorizan a la API a alcanzar RabbitMQ, solo al worker.
usesBroker: true

# API y worker comparten Secret. Es el mismo servicio, la misma frontera de
# confianza y el mismo código: separarlos daría dos objetos que siempre habría
# que rotar juntos, con la oportunidad de olvidar uno.
secretSuffix: notification-service-secret

config:
  QUEUE_ORDER_EVENTS: "notification.order-events"
  QUEUE_HEARTBEAT_SUMMARY: "notification.heartbeat-summary"
  # Con `smtp_enabled=false` el mensaje se arma completo, se guarda y se
  # escribe en el log en lugar de salir a internet. Es el modo por defecto
  # porque la práctica se evalúa sin credenciales de un proveedor real.
  SMTP_ENABLED: "false"
  SMTP_FROM: "no-reply@tienda.com"
  CORS_ORIGINS: "http://sa-p5.local,http://localhost:8080"

# No llama a ningún otro microservicio: recibe eventos del broker.
serviceRefs: {}

probes:
  enabled: true
  kind: http
  startup:
    path: /health/startup
    periodSeconds: 3
    failureThreshold: 25
  liveness:
    path: /health
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    path: /health/ready
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 160Mi
  limits:
    cpu: 500m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  rules: []

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

affinity:
  antiAffinity: true

terminationGracePeriodSeconds: 30
tmpSizeLimit: 64Mi


# ===========================================================================
# worker — El consumidor del broker
# ===========================================================================
worker:
  enabled: true

  # Dos réplicas fijas. Ambas consumen de las mismas colas y RabbitMQ reparte
  # los mensajes entre ellas (round-robin acotado por el prefetch).
  #
  # Que sean dos y no una es lo que hace que la idempotencia deje de ser
  # teórica: con dos consumidores, una reentrega puede llegarle a una réplica
  # distinta de la que la procesó, y la restricción UNIQUE en la base es lo
  # único que impide el duplicado. Una comprobación previa en Python
  # ("¿ya existe?, si no, inserto") tendría una carrera que estas dos réplicas
  # encuentran sin esfuerzo.
  replicaCount: 2

  # Sin HPA, y conviene decir por qué en lugar de que parezca un olvido.
  #
  # Un consumidor no se escala por CPU: se escala por profundidad de cola. Un
  # worker esperando mensajes usa CPU cerca de cero, así que un HPA por CPU
  # nunca lo escalaría por mucho que la cola creciera —justo cuando haría
  # falta—. Escalar por profundidad de cola exige métricas externas (KEDA o el
  # adaptador de Prometheus), y la observabilidad está declarada fuera del
  # alcance de esta práctica.
  autoscaling:
    enabled: false

  # Sí tiene PDB: es tan sensible a un drenaje de nodo como cualquier otro
  # componente, y perder ambas réplicas a la vez detendría el consumo.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 320Mi

  # Más margen que los demás: al recibir SIGTERM el worker termina el mensaje
  # que tenga entre manos antes de cerrar. Cortarlo a la mitad no pierde datos
  # —sin `ack`, RabbitMQ lo reentrega— pero provoca trabajo repetido y ruido en
  # los logs en cada `helm upgrade`.
  terminationGracePeriodSeconds: 45


# ---------------------------------------------------------------------------
# rollout — entrega progresiva con Argo Rollouts (Práctica 8)
#
# Apagado. Este componente se despliega con un Deployment y una actualización
# progresiva corriente (`maxUnavailable: 0`), que es lo correcto para un
# servicio interno: no recibe tráfico de usuarios directamente, así que un
# canary no tendría a quién exponer la versión nueva por partes.
#
# El componente que SÍ lo activa es `api-gateway`, que es el único con Ingress.
# Ver `charts/api-gateway/values.yaml`.
# ---------------------------------------------------------------------------
rollout:
  enabled: false
