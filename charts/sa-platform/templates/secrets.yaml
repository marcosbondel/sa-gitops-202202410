{{/*
secrets.yaml — Todas las credenciales del sistema, en un solo lugar del código
               y en varios objetos distintos dentro del clúster.

## Por qué son varios Secrets y no uno solo

Un Secret se consume entero: `envFrom.secretRef` inyecta todas sus claves.
Un único Secret con todo dentro significaría que catalog-service arranca con la
llave de firma del JWT y la contraseña del broker en su entorno, sin usarlas
nunca. Cualquier volcado de variables desde ese pod —un log de depuración, un
`kubectl exec env`, un mensaje de error verboso— las expondría.

Con un Secret por consumidor, un pod comprometido solo entrega lo que ese pod
necesitaba. Es mínimo privilegio aplicado a la configuración, y es barato: son
unos cuantos objetos más.

## Por qué `required` en cada valor

Sin él, un `helm install` sin credenciales instalaría el sistema con
contraseñas vacías y todo *parecería* funcionar hasta que alguien lo notara.
Con `required`, el render falla antes de tocar el clúster y el mensaje dice
exactamente qué falta.

## Por qué los nombres son literales y no llevan el nombre del release

Los subcharts de Bitnami necesitan el nombre del Secret en
`postgresql.auth.existingSecret` y `rabbitmq.auth.existingPasswordSecret`, y
esos campos son cadenas en values.yaml: Helm no renderiza plantillas dentro de
los valores. Un nombre calculado a partir de `.Release.Name` sería imposible de
referenciar desde ahí.

La consecuencia es acotada y conviene decirla: dos releases de este chart en el
**mismo namespace** chocarían sobre estos objetos. No es un escenario que el
chart contemple —es la plataforma completa, no una pieza que se instale varias
veces— y en namespaces distintos no hay conflicto alguno.

Todo lo demás sí se nombra con el release por delante, y los hosts de las
dependencias se calculan en las plantillas, de modo que el chart funciona con
cualquier nombre de release.

## Sobre `stringData`

Se usa en lugar de `data` para no tener que codificar en base64 desde la
plantilla. Kubernetes lo codifica al recibirlo. Conviene recordar que base64
**no es cifrado**: un Secret está codificado, no protegido, y quien pueda
leerlo lo lee. Lo que aporta es que no viaja en el ConfigMap, no aparece en
`helm get values` y se puede restringir con RBAC por separado. El cifrado real
sería `encryption at rest` en etcd o un gestor externo, y queda fuera de
alcance.
*/}}

{{/* ---------------------------------------------------------------------
     `secrets.create` — quién produce estos Secrets (Práctica 8)

     Por defecto `true`, que es como funcionaban las Prácticas 5, 6 y 7: quien
     despliega es una persona que pasa `-f secretos.yaml` desde su disco, el
     chart renderiza los Secrets y los `required` de abajo fallan con un
     mensaje claro si falta alguno.

     La Práctica 8 lo pone en `false`. Allí quien despliega es ArgoCD leyendo
     un repositorio PÚBLICO, así que no existe ningún `-f secretos.yaml` que
     pasarle y no puede existir: no hay dónde ponerlo que no sea público.
     Los Secrets los produce el controlador de Sealed Secrets a partir de los
     `SealedSecret` versionados —cifrados con la clave pública del clúster—, y
     el chart se limita a consumirlos por nombre.

     Lo que NO cambia son los nombres: `sa-platform-db-credentials`,
     `sa-platform-db-initdb-env`, `sa-platform-broker-credentials` y
     `sa-platform-app-secrets`. El resto del chart los referencia por ahí, así
     que quien los cree tiene que llamarlos igual. Es la única cosa que el
     `SealedSecret` del repositorio GitOps tiene que acertar, y por eso
     `P8/scripts/02-sellar-secretos.sh` los toma de esta lista y no de una
     copia escrita a mano.
     --------------------------------------------------------------------- */}}
{{- if .Values.secrets.create }}

{{- $ns := include "sa-platform.namespace" . -}}
{{- $labels := include "sa-platform.labels" . -}}

{{/* ---------------------------------------------------------------------
     Superusuario de PostgreSQL. Lo consume el subchart de Bitnami.
     --------------------------------------------------------------------- */}}
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-db-credentials
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  # El nombre de la clave no es libre: es el que declara
  # `postgresql.auth.secretKeys.adminPasswordKey` en values.yaml.
  postgres-password: {{ required "Falta secrets.postgresAdminPassword (ver values.example.yaml)" .Values.secrets.postgresAdminPassword | quote }}

---
{{/* ---------------------------------------------------------------------
     Contraseñas de cada base lógica, con nombres de variable de entorno.

     Este Secret lo monta el contenedor de PostgreSQL durante la
     inicialización (`primary.extraEnvVarsSecret`), y el script de initdb las
     lee por nombre. Las claves son identificadores válidos de shell
     —MAYÚSCULAS con guion bajo— y no nombres con guiones, porque Kubernetes
     descarta silenciosamente las claves que no lo son al inyectarlas como
     variables de entorno: el script recibiría una variable vacía y crearía un
     usuario sin contraseña.
     --------------------------------------------------------------------- */}}
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-db-initdb-env
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.databases }}
  {{ .envVar }}: {{ required (printf "Falta secrets.databasePasswords.%s" .name) (index $.Values.secrets.databasePasswords .name) | quote }}
  {{- end }}

---
{{/* ---------------------------------------------------------------------
     Credenciales del broker. Las consume el subchart de RabbitMQ.
     --------------------------------------------------------------------- */}}
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-broker-credentials
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  rabbitmq-password: {{ required "Falta secrets.rabbitmqPassword" .Values.secrets.rabbitmqPassword | quote }}
  # Ver el comentario en values.yaml: si esta cookie cambiara entre upgrades,
  # el nodo no podría reincorporarse y quedaría en CrashLoopBackOff.
  rabbitmq-erlang-cookie: {{ required "Falta secrets.rabbitmqErlangCookie" .Values.secrets.rabbitmqErlangCookie | quote }}

---
{{/* ---------------------------------------------------------------------
     auth-service — el único que maneja secretos criptográficos.

     Concentrar aquí el JWT, el AES y el HMAC es lo que permite que los demás
     servicios no los tengan: order-service no valida tokens, recibe la
     identidad ya resuelta en cabeceras que inyecta el gateway. Menos secretos
     por servicio es menos superficie que proteger.
     --------------------------------------------------------------------- */}}
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-auth-service-secret
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Falta secrets.databasePasswords.auth_db" (index .Values.secrets.databasePasswords "auth_db") | quote }}
  JWT_SECRET_KEY: {{ required "Falta secrets.jwtSecretKey" .Values.secrets.jwtSecretKey | quote }}
  AES_SECRET_KEY: {{ required "Falta secrets.aesSecretKey" .Values.secrets.aesSecretKey | quote }}
  HMAC_SECRET_KEY: {{ required "Falta secrets.hmacSecretKey" .Values.secrets.hmacSecretKey | quote }}
  SEED_ADMIN_PASSWORD: {{ required "Falta secrets.seedAdminPassword" .Values.secrets.seedAdminPassword | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-catalog-service-secret
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Falta secrets.databasePasswords.catalog_db" (index .Values.secrets.databasePasswords "catalog_db") | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-order-service-secret
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Falta secrets.databasePasswords.order_db" (index .Values.secrets.databasePasswords "order_db") | quote }}
  RABBITMQ_PASSWORD: {{ required "Falta secrets.rabbitmqPassword" .Values.secrets.rabbitmqPassword | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-notification-service-secret
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Falta secrets.databasePasswords.notification_db" (index .Values.secrets.databasePasswords "notification_db") | quote }}
  RABBITMQ_PASSWORD: {{ required "Falta secrets.rabbitmqPassword" .Values.secrets.rabbitmqPassword | quote }}

{{- if .Values.cronjobs.enabled }}
---
{{/* ---------------------------------------------------------------------
     Los dos trabajos programados.

     El escritor NO recibe las credenciales del broker: no publica nada. Es la
     misma idea del resto del archivo llevada al último rincón —un secreto que
     no se inyecta no se puede filtrar desde un pod comprometido—.
     --------------------------------------------------------------------- */}}
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-heartbeat-writer-secret
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Falta secrets.databasePasswords.ops_db" (index .Values.secrets.databasePasswords "ops_db") | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: sa-platform-heartbeat-summarizer-secret
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Falta secrets.databasePasswords.ops_db" (index .Values.secrets.databasePasswords "ops_db") | quote }}
  RABBITMQ_PASSWORD: {{ required "Falta secrets.rabbitmqPassword" .Values.secrets.rabbitmqPassword | quote }}
{{- end }}
{{- end }}
