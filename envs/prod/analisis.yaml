# ===========================================================================
# envs/prod/analisis.yaml — Umbrales del análisis por métricas en producción
# (Práctica 10, chart `charts/sa-p10-analisis`).
#
# Más estrictos que en stage, por la misma razón que en la P8: producción
# tiene más réplicas, autoescalado y más tráfico, así que sus métricas tienen
# menos ruido y puede sostener un umbral más cercano a lo que un cliente
# tolera. Y es donde una regresión que se cuela la pagan clientes.
#
# Hasta la P9 este archivo alimentaba a `charts/sa-p8-analisis` (Jobs de humo,
# integración y carga con k6). Ese chart sigue en el repositorio como
# historia.
# ===========================================================================
umbrales:
  # Con el canary al 10 % la versión nueva recibe ~50 peticiones en la ventana
  # de 2 minutos: un 2 % son uno o dos errores aislados (recargas de nginx),
  # tres ya no.
  tasaErrores: "0.02"
  # La versión estable mide un p95 de ~0,17 s en el gateway, dominado por el
  # checkout (que escribe en la base y publica en el broker). 0,4 s es más del
  # doble: una regresión real lo cruza; el calentamiento de un pod nuevo, no.
  latenciaP95: "0.4"
  # Más tráfico que en stage: exigir más evidencia antes de promover.
  traficoMinimo: "20"
