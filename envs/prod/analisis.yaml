# ===========================================================================
# envs/prod/analisis.yaml — Umbrales de las puertas de calidad en producción.
#
# Más estrictos que en stage, y esa es toda la diferencia entre los dos
# ambientes en lo que a validación se refiere.
#
# ## Por qué producción es más estricta y no al revés
#
# La intuición dice lo contrario: si stage es donde se prueba, debería ser el
# exigente. Pero stage tiene un solo juego de réplicas sin autoescalado y
# comparte una laptop con todo lo demás, así que su latencia tiene más ruido.
# Un umbral apretado ahí produciría abortos por el entorno y no por el código,
# y un canary que aborta por ruido enseña a la gente a promover a mano.
#
# Producción tiene el HPA, más réplicas y más margen, así que puede sostener un
# umbral más cercano a lo que un usuario toleraría. Y es donde el costo de
# dejar pasar una regresión lo pagan usuarios reales.
#
# La consecuencia se asume: una versión puede pasar el canary de stage y fallar
# el de producción. Eso no es un fallo del proceso, es el proceso funcionando
# —la promoción a producción es una decisión aparte, con su propio Pull Request
# y su propio análisis—.
# ===========================================================================

carga:
  # 0.5 % en vez de 1 %. Con el HPA manteniendo capacidad, los únicos errores
  # esperables siguen siendo los de la recarga de nginx al cambiar el peso del
  # canary: un puñado sobre ~5300 peticiones (el doble de usuarios virtuales
  # durante la misma ventana).
  umbralErrores: "0.005"

  # 200 ms en vez de los 300 de stage.
  #
  # La línea base de stage es de 9 ms (p95) con la plataforma en reposo.
  # Producción tiene el HPA y más réplicas, así que reparte mejor y su latencia
  # bajo carga es más estable —no más baja necesariamente, pero sí con menos
  # varianza—. Eso permite apretar el margen sin generar falsos positivos.
  #
  # Sigue siendo más de veinte veces la línea base: lo que cambia entre los dos
  # ambientes es cuánta degradación se tolera antes de parar, no el orden de
  # magnitud.
  umbralP95: "200"
  umbralP99: "400"

  # Más carga: con 3 a 6 réplicas, 15 usuarios virtuales no llegarían a
  # ejercitar nada. 30 es lo que hace que la medición diga algo.
  usuariosVirtuales: "30"

recursos:
  k6:
    # El generador de carga necesita más CPU al doblar los usuarios virtuales.
    # Si se queda corto, el cuello de botella es k6 y la latencia que mide es
    # la suya: la prueba aprobaría una versión lenta porque no consiguió
    # cargarla.
    requests: { cpu: 400m, memory: 192Mi }
    limits: { cpu: 1200m, memory: 512Mi }
